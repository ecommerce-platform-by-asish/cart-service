server:
  port: 8083
  servlet:
    context-path: /api/cart

app:
  openapi:
    enabled: true
    title: "Cart Service API"
    description: "Shopping Cart Management Service"
    version: "1.0.0"

spring:
  application:
    name: cart-service
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only
  datasource:
    url: jdbc:postgresql://localhost:5434/cart_db
    username: ecommerce
    password: admin
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 3000
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6381
  
  # gRPC Client Configuration
  grpc:
    client:
      channels:
        pricingService:
          address: static://localhost:9090
          negotiation-type: plaintext


