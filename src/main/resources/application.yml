server:
  port: 8083
  servlet:
    context-path: /api/cart

app:
  openapi:
    enabled: true
    title: "Cart Service API"
    description: "Shopping Cart Management Service"
    version: "1.0.0"

spring:
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  application:
    name: cart-service
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
  datasource:
    url: jdbc:postgresql://localhost:5434/cart_db
    username: ecommerce
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 3000
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
  data:
    redis:
      host: localhost
      port: 6381
  
  # gRPC Client Configuration
  grpc:
    client:
      channels:
        pricingService:
          address: static://localhost:9090
          negotiation-type: plaintext

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  use-management-port: false
